<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Yves Gildemeister (Schnief) – Fullstack Developer</title>
  <desc id="desc">HUD-style banner in anthracite and electric blue: Player 1 ready, Yves Gildemeister aka Schnief, class Fullstack Developer, 9 live missions, 19 skills in the loadout, based in Germany and working remote.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e3c78" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c5fd6" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#1c5fd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c5fd6"/>
      <stop offset="1" stop-color="#0b7ea6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b7ea6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0b7ea6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0b7ea6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><path d="M44 20 H1180 V276 L1156 300 H20 V44 Z"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="#eef1f6"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- main frame with cut corners -->
  <path d="M44 20 H1180 V276 L1156 300 H20 V44 Z" fill="#ffffff" fill-opacity="0.72" stroke="#aab6c8"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="1160" height="280" fill="url(#glow)"/>
    <rect x="20" y="-60" width="1160" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;320" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- corner brackets -->
  <path d="M20 76 V44 L44 20 H96" fill="none" stroke="#1c5fd6" stroke-width="3"/>
  <path d="M1180 244 V276 L1156 300 H1104" fill="none" stroke="#1c5fd6" stroke-width="3"/>
  <path d="M1124 20 H1180 V52" fill="none" stroke="#cdd5e1" stroke-width="2"/>
  <path d="M20 248 V300 H76" fill="none" stroke="#cdd5e1" stroke-width="2"/>

  <!-- logo mark (Schniefs Portfolio gamepad) -->
  <g transform="translate(56 78)">
    <path d="M14 0 H164 V150 L150 164 H0 V14 Z" fill="#f3f5f9" stroke="#cdd5e1"/>
    <svg x="10" y="10" width="144" height="144" viewBox="0 0 100 100"><defs><linearGradient id="kice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fcff"/><stop offset=".46" stop-color="#a6e0ff"/><stop offset=".54" stop-color="#4aa3ff"/><stop offset="1" stop-color="#1f5fd0"/></linearGradient><linearGradient id="kblue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d8bff"/><stop offset="1" stop-color="#38d4ff"/></linearGradient></defs>
<g transform="translate(12 16) scale(0.85)"><g><path d="M0 -7 L7 -3.5 V4 L0 7.5 L-7 4 V-3.5Z" fill="#38d4ff" opacity=".18"/><path d="M0 -6 L6 -3 L0 0 L-6 -3Z" fill="#9fdcff"/><path d="M-6 -3 L0 0 V7 L-6 4Z" fill="#1f5fd0"/><path d="M6 -3 L0 0 V7 L6 4Z" fill="#0a1f4d"/><path d="M0 -6 L6 -3 V4 L0 7 L-6 4 V-3Z M0 0 V7 M-6 -3 L0 0 L6 -3" fill="none" stroke="#bfe6ff" stroke-width=".6" stroke-linejoin="round"/></g></g><g transform="translate(88 14) scale(0.7)"><g><path d="M0 -7 L7 -3.5 V4 L0 7.5 L-7 4 V-3.5Z" fill="#38d4ff" opacity=".18"/><path d="M0 -6 L6 -3 L0 0 L-6 -3Z" fill="#9fdcff"/><path d="M-6 -3 L0 0 V7 L-6 4Z" fill="#1f5fd0"/><path d="M6 -3 L0 0 V7 L6 4Z" fill="#0a1f4d"/><path d="M0 -6 L6 -3 V4 L0 7 L-6 4 V-3Z M0 0 V7 M-6 -3 L0 0 L6 -3" fill="none" stroke="#bfe6ff" stroke-width=".6" stroke-linejoin="round"/></g></g><g transform="translate(90 90) scale(0.6)"><g><path d="M0 -7 L7 -3.5 V4 L0 7.5 L-7 4 V-3.5Z" fill="#38d4ff" opacity=".18"/><path d="M0 -6 L6 -3 L0 0 L-6 -3Z" fill="#9fdcff"/><path d="M-6 -3 L0 0 V7 L-6 4Z" fill="#1f5fd0"/><path d="M6 -3 L0 0 V7 L6 4Z" fill="#0a1f4d"/><path d="M0 -6 L6 -3 V4 L0 7 L-6 4 V-3Z M0 0 V7 M-6 -3 L0 0 L6 -3" fill="none" stroke="#bfe6ff" stroke-width=".6" stroke-linejoin="round"/></g></g><g transform="translate(8 92) scale(0.55)"><g><path d="M0 -7 L7 -3.5 V4 L0 7.5 L-7 4 V-3.5Z" fill="#38d4ff" opacity=".18"/><path d="M0 -6 L6 -3 L0 0 L-6 -3Z" fill="#9fdcff"/><path d="M-6 -3 L0 0 V7 L-6 4Z" fill="#1f5fd0"/><path d="M6 -3 L0 0 V7 L6 4Z" fill="#0a1f4d"/><path d="M0 -6 L6 -3 V4 L0 7 L-6 4 V-3Z M0 0 V7 M-6 -3 L0 0 L6 -3" fill="none" stroke="#bfe6ff" stroke-width=".6" stroke-linejoin="round"/></g></g>
<path d="M22 36 Q24 28 34 28 H66 Q76 28 78 36 L88 68 Q90 82 79 83 Q71 84 66 73 L62 66 H38 L34 73 Q29 84 21 83 Q10 82 12 68 Z" fill="#0b0f16"/>
<path d="M22 36 Q24 28 34 28 H66 Q76 28 78 36 L88 68 Q90 82 79 83 Q71 84 66 73 L62 66 H38 L34 73 Q29 84 21 83 Q10 82 12 68 Z" fill="none" stroke="url(#kblue)" stroke-width="2.6" stroke-linejoin="round"/>
<g fill="#38d4ff"><rect x="25.6" y="38.3" width="4.8" height="12.4" rx="1"/><rect x="21.8" y="42.1" width="12.4" height="4.8" rx="1"/></g>
<circle cx="71.5" cy="39.1" r="2.4" fill="#38d4ff"/><circle cx="76.9" cy="44.5" r="2.4" fill="#38d4ff"/><circle cx="71.5" cy="49.9" r="2.4" fill="#38d4ff"/><circle cx="66.1" cy="44.5" r="2.4" fill="#38d4ff"/>
<circle cx="36" cy="60" r="5.4" fill="#13284d" stroke="#38d4ff" stroke-width="1.2"/><circle cx="64" cy="60" r="5.4" fill="#13284d" stroke="#38d4ff" stroke-width="1.2"/>
<g><path d="M39.6 36.5 H42.6 Q47.6 36.5 47.6 44.5 Q47.6 52.5 42.6 52.5 H39.6 Z" fill="none" stroke="#38d4ff" stroke-width="4.6" opacity=".35"/><path d="M39.6 36.5 H42.6 Q47.6 36.5 47.6 44.5 Q47.6 52.5 42.6 52.5 H39.6 Z" fill="none" stroke="#bfe6ff" stroke-width="2.4"/></g>
<g transform="translate(55.6 44.5) scale(0.28)"><path d="M16 -17 H-10 L-15 -12 V-5 L-10 0 H10 L15 5 V12 L10 17 H-16" fill="none" stroke="url(#kice)" stroke-width="9" stroke-linejoin="miter"/></g></svg>
  </g>

  <!-- identity -->
  <g transform="translate(256 0)">
    <circle cx="6" cy="86" r="5" fill="#0b8a76">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="91" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="3" fill="#0b8a76">PLAYER 1 READY</text>
    <text x="0" y="128" font-family="'Chakra Petch','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#4b5668">Hi, I am</text>
    <text x="0" y="180" font-family="'Chakra Petch','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="0.5" fill="#111722">Yves Gildemeister</text>
    <text x="0" y="212" font-family="'Chakra Petch','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#1a56c2">aka Schnief</text>
    <g transform="translate(0 232)">
      <path d="M0 0 H300 V24 L290 34 H0 Z" fill="#1c5fd6"/>
      <text x="14" y="22" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#ffffff">CLASS · FULLSTACK DEVELOPER</text>
    </g>
    <text x="318" y="254" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#4b5668">DE / EN</text>
  </g>

  <!-- stats -->
  <g transform="translate(872 52)">
    <path d="M10 0 H284 V44 L274 54 H0 V10 Z" fill="#f3f5f9" stroke="#cdd5e1"/>
    <rect x="0" y="16" width="3" height="22" fill="#0b7ea6"/>
    <text x="18" y="22" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.5" fill="#4b5668">MISSIONS</text>
    <text x="18" y="44" font-family="'Chakra Petch','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111722">09<tspan font-size="13" font-weight="600" fill="#0b7ea6" dx="8">LIVE</tspan></text>
  </g>
  <g transform="translate(872 118)">
    <path d="M10 0 H284 V44 L274 54 H0 V10 Z" fill="#f3f5f9" stroke="#cdd5e1"/>
    <rect x="0" y="16" width="3" height="22" fill="#5b48d6"/>
    <text x="18" y="22" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.5" fill="#4b5668">LOADOUT</text>
    <text x="18" y="44" font-family="'Chakra Petch','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111722">19<tspan font-size="13" font-weight="600" fill="#5b48d6" dx="8">SKILLS</tspan></text>
  </g>
  <g transform="translate(872 184)">
    <path d="M10 0 H284 V44 L274 54 H0 V10 Z" fill="#f3f5f9" stroke="#cdd5e1"/>
    <rect x="0" y="16" width="3" height="22" fill="#0b8a76"/>
    <text x="18" y="22" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.5" fill="#4b5668">BASE</text>
    <text x="18" y="44" font-family="'Chakra Petch','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#111722">Germany<tspan font-size="13" font-weight="600" fill="#0b8a76" dx="8">· REMOTE</tspan></text>
  </g>

  <!-- xp bar -->
  <g transform="translate(872 254)">
    <text x="0" y="10" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.5" fill="#4b5668">LEARNING MODE: ALWAYS ON</text>
    <rect x="0" y="18" width="284" height="6" fill="#f3f5f9" stroke="#cdd5e1"/>
    <rect x="0" y="18" width="200" height="6" fill="url(#xp)">
      <animate attributeName="width" values="150;262;150" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
